<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; box-sizing: border-box; }
body {
  width: 1400px; height: 980px; position: relative; overflow: hidden;
  background: #f2ece1; font-family: 'Space Grotesk', Arial, sans-serif;
}
/* faint round token mark behind everything */
.watermark {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 900px; height: 900px; opacity: 0.07;
}.phone {
  position: absolute; left: 525px; top: 140px; width: 350px; height: 684px;
  background: #131211; border-radius: 54px; padding: 13px;
  box-shadow: 0 34px 90px rgba(31, 18, 8, 0.35);
}
.screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #fff; }
.screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.card {
  position: absolute; background: #fffdfb; border-radius: 20px;
  box-shadow: 0 26px 70px rgba(31, 18, 8, 0.16); padding: 24px 28px;
}
.label {
  font-size: 13px; letter-spacing: 0.14em; color: #c8401f; font-weight: 700;
  text-transform: uppercase; margin-bottom: 12px;
}
.row { font-size: 20px; color: #1c1917; margin: 8px 0; display: flex; align-items: center; gap: 10px; }
.row .big { font-size: 24px; font-weight: 700; }
.ok { color: #12833b; font-weight: 700; }
.hid { color: #a39a8e; }
.hid s { text-decoration-thickness: 1.5px; }
.powered {
  position: absolute; left: 525px; top: 892px; width: 350px;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  font-size: 15px; font-weight: 500; letter-spacing: 0.18em; color: #1c1917;
}
.powered img { height: 30px; display: block; }
</style>
</head>
<body>
  <img class="watermark" src="../../public/tokens/strk.png" alt="">

  <div class="phone">
    <div class="screen"><img src="home-marketplace.png" alt=""></div>
  </div>

  <div class="card" style="left: 930px; top: 165px; width: 350px;">
    <div class="label">Seller's view</div>
    <div class="row big">PS5 &middot; 360 USDC</div>
    <div class="row"><span class="ok">&#10003; Paid.</span>&nbsp; That is all they see</div>
    <div class="row hid"><s>wallet address</s>&nbsp; hidden</div>
    <div class="row hid"><s>remaining balance</s>&nbsp; hidden</div>
  </div>

  <div class="card" style="left: 90px; top: 500px; width: 330px;">
    <div class="label">Buyer's wallet</div>
    <div class="row big">0x7f&hellip;c9a2</div>
    <div class="row hid">never shared with the seller</div>
    <div class="row"><span class="ok">&#10003;</span>&nbsp; the rest of the balance stays yours</div>
  </div>

  <div class="powered">
    POWERED BY
    <img src="../../public/tokens/strk20.png" alt="STRK20">
  </div>
</body>
</html>
