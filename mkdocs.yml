site_name: GhostDeal
site_description: Pay like cash. The other person never sees your remaining balance.
site_url: https://github.com/JaDi03/GhostDeal
repo_url: https://github.com/JaDi03/GhostDeal
repo_name: JaDi03/GhostDeal
edit_uri: ""
copyright: GhostDeal. MIT License.

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  font:
    text: Space Grotesk
    code: IBM Plex Mono

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/extra.js

nav:
  - Home: index.md
  - How a deal works: how-it-works.md
  - What is private: privacy.md
  - Architecture: architecture.md
  - Run locally: run.md
  - For judges: judging.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search
